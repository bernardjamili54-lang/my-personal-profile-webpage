<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bernardo Jamili C. - Contact Me</title>
    <link rel="stylesheet" href="style.css">
</head>
<form>

    <label class="form-label" for="name">Name:</label>
    <br>
    <input class="form-input" type="text" id="name" name="name" required>
    <br><br>

    <label class="form-label" for="age">Age:</label>
    <br>
    <input class="form-input" type="number" id="age" name="age"
           min="1" max="100" required>
    <br><br>

    <label class="form-label">Gender:</label>
    <br>

    <input type="radio" id="male" name="gender" value="Male" required>
    <label for="male">Male</label>

    <input type="radio" id="female" name="gender" value="Female">
    <label for="female">Female</label>

    <br><br>

    <label class="form-label" for="strand">Strand:</label>
    <br>

    <select class="form-input" id="strand" name="strand" required>
        <option value="">Select your strand</option>
        <option value="ICT">ICT</option>
        <option value="STEM">STEM</option>
        <option value="ABM">ABM</option>
        <option value="HUMSS">HUMSS</option>
        <option value="GAS">GAS</option>
    </select>

    <br><br>

    <label class="form-label" for="email">Email:</label>
    <br>
    <input class="form-input" type="email" id="email" name="email" required>
    <br><br>

    <label class="form-label" for="message">Message:</label>
    <br>

    <textarea class="form-input" id="message" name="message"
              rows="6" cols="40"
              placeholder="Type your message here..."></textarea>

    <br><br>

    <button type="submit">Send Message</button>
    <button type="reset">Clear Form</button>

</form>
