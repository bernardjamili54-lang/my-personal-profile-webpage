<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="style.css">
    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
        emailjs.init({
            publicKey: "egjOQc-7p4HJyyZBq"
        });
    </script>
</head>
<body>
    <h1 id="page-title">Contact Me</h1>
    <nav>
        <a class="nav-link" href="index.html">Home</a> |
        <a class="nav-link" href="about me.html">About me</a> |
        <a class="nav-link" href="Hobbies.html">My hobbies</a> |
        <a class="nav-link" href="Goals.html">My goals</a> |
        <a class="nav-link" href="Favorites.html">My Favorites</a> |
        <a class="nav-link highlight" href="contact.html">Contact Me</a>
    </nav>
    <hr>

    <section id="contact-section">
        <form id="contact-form">
            <!-- Name -->
            <label class="form-label" for="name">Full Name:</label>
            <input
                class="form-input"
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >
            <br><br>
            <!-- Email -->
            <label class="form-label" for="email">Gmail:</label>
            <input
                class="form-input"
                type="email"
                id="email"
                name="email"
                placeholder="Enter your Gmail"
                required
            >
            <br><br>
            <!-- Gender -->
            <label class="form-label">Gender:</label>
            <br>
            <input type="radio" id="male" name="gender" value="Male" required>
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
            <input type="radio" id="gay" name="gender" value="Gay">
            <label for="gay">Gay</label>
            <input type="radio" id="lesbian" name="gender" value="Lesbian">
            <label for="lesbian">Lesbian</label>
            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
            <br><br>

            <!-- Strand -->
            <label class="form-label" for="strand">Strand:</label>
            <select class="form-input" id="strand" name="strand" required>
                <option value="">Select Strand</option>
                <option value="ICT">ICT</option>
                <option value="STEM">STEM</option>
                <option value="ABM">ABM</option>
                <option value="GAS">GAS</option>
                <option value="HUMSS">HUMSS</option>
            </select>
            <br><br>
            <!-- Message -->
            <label class="form-label" for="message">Message:</label>
            <br>
            <textarea
                class="form-input"
                id="message"
                name="message"
                rows="5"
                cols="50"
                placeholder="Type your message here..."
                required
            ></textarea>
            <br><br>
            <button type="submit">Send Message</button>
            <button type="reset">Clear Form</button>
        </form>
    </section>

    <script>
        const form = document.getElementById("contact-form");
        form.addEventListener("submit", function(event) {
            event.preventDefault();
            emailjs.sendForm(
                "service_dllkglf",
                "template_oe5a6f3",
                form
            )
            .then(function(response) {
                console.log("SUCCESS!", response.status, response.text);
                alert("Message sent successfully!");
                form.reset();
            })
            .catch(function(error) {
                console.error("EMAILJS ERROR:", error);
                alert(
                    "Message failed to send.\n\n" +
                    "Please check the browser console (F12) for the error."
                );
            });
        });
    </script>
</body>
</html>
